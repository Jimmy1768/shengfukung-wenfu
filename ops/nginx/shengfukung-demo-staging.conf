# ops/nginx/shengfukung-demo-staging.conf
#
# Staging vhost, separate from ops/nginx/shengfukung-demo.conf
# (production). Backend-only: staging exists to isolate/protect the
# production database for testing Rails behavior, not to host a second
# copy of the marketing site. There is no Vue build deployed here and
# there is not meant to be one -- earlier revisions of this file copied
# production's `root` + SPA `try_files ... /index.html` fallback, which
# pointed at a /var/www/shengfukung-demo-staging directory nothing
# ever populates; that was a copy/paste mistake, not a real requirement,
# and has been removed. Anything outside the proxied backend routes
# below now just 404s, matching the fact there's no frontend to serve.
#
# Points at the staging Puma upstream (port 4002, matching
# config/puma.rb's `when "staging"` case and the RAILS_ENV=staging/
# PUMA_PORT=4002 override baked into
# ops/systemd/shengfukung-demo-staging-puma.service's ExecStart --
# there is no separate staging env file, staging shares production's
# own) and the staging checkout's own backend asset path, not
# production's.
#
# Two things this file assumes but cannot itself arrange -- neither is
# a repo change, both are host/DNS/certificate actions for whoever
# deploys this:
# - DNS: staging.shengfukung.com.tw resolves to this droplet's IP as of
#   2026-08-23 (an A record was added at Bluehost, where this domain's
#   nameservers live). Verified directly via `dig` against the
#   authoritative nameserver, not just a cached resolver.
# - TLS: reuses the same certificate path as production. As of
#   2026-08-23 that certificate's SAN list is only shengfukung.com.tw
#   and www.shengfukung.com.tw (checked directly against the live cert)
#   -- it does NOT yet cover this staging name. Needs:
#     sudo certbot certonly --nginx --expand \
#       -d shengfukung.com.tw -d www.shengfukung.com.tw \
#       -d staging.shengfukung.com.tw
#   before this vhost is installed and nginx reloaded, or browsers will
#   show a certificate-name-mismatch warning for this hostname.

upstream rails_puma_staging {
  server 127.0.0.1:4002 fail_timeout=0;
}

server {
  listen 80;
  server_name staging.shengfukung.com.tw;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name staging.shengfukung.com.tw;

  ssl_certificate /etc/letsencrypt/live/shengfukung.com.tw/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shengfukung.com.tw/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location ^~ /backend/assets/ {
    alias /home/jimmy1768_user/Projects/shengfukung-demo-staging/rails/public/backend/assets/;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    alias /home/jimmy1768_user/Projects/shengfukung-demo-staging/rails/public/backend/assets/;
    try_files $uri =404;
  }

  location ^~ /marketing/admin {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /admin {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /internal {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /account {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /dev {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /auth {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api {
    proxy_pass http://rails_puma_staging;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / { return 404; }
}
