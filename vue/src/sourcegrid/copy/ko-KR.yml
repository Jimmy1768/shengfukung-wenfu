brands:
  hotel:
    name: Emberlight 부티크 호텔
    tagline: 도시 테이스트메이커를 위한 빛의 머무름.
    description: 스파와 중정, 계절 테이스팅 메뉴가 있는 럭셔리 시티 리트릿.
    settings:
      lobby:
        label: 로비 라운지
        description: 호박빛 조명 속에 파묻힌 벨벳 소파와 큐레이션된 바이닐, 삼나무 차 서비스가 있는 응접실.
      pool:
        label: 인피니티 풀
        description: 유리 가장자리의 루프톱 레인과 황혼 랩을 위한 프라이빗 카바나.
      courtyard:
        label: 코트야드
        description: 시트러스 나무와 랜턴이 겹겹이 둘러싼 돌마당, 낮은 테이블에서 즐기는 아페리티보 타임.
      suite:
        label: 스카이라인 스위트
        description: 석고 아치와 천장 높이 창, 가득 찬 바이닐 바 카트를 갖춘 코너 레지던스.
    elements:
      chefs-salon:
        label: 셰프 살롱
        description: 계절 파티스리와 테이블사이드 인퓨전을 더한 새벽 테이스팅 메뉴.
      garden-spa:
        label: 가든 스파 리추얼
        description: 중정 위에 자리한 삼나무 하맘에서 즐기는 스팀과 소킹, 깊은 호흡.
      wellness-towels:
        label: 웰니스 아틀리에
        description: 갓 데운 타월과 아로마 블렌드, 상시 대기하는 스파 소믈리에.
      atelier:
        label: 핸드크래프트 디테일
        description: 석고 아치, 세라믹 인레이, 로컬 장인의 맞춤 섬유.
    highlights:
      curated-suites:
        title: 큐레이티드 스위트
        body: 조각된 석고 아치와 맞춤 린넨으로 둘러싸인 햇살 가득한 거주 공간.
      garden-spa-rituals:
        title: 가든 스파 리추얼
        body: 루프톱 온천과 프라이빗 하맘, 객실 내 웰니스 소믈리에를 즐길 수 있는 프로그램.
      chef-salon:
        title: 셰프 살롱
        body: 부티크 프로듀서와 세리머니 티가 페어링된 계절 테이스팅 코스.
    press:
      - quote: 주말 동안 스카이라인 펜트하우스를 물려받은 기분.
        source: 시티 레저
      - quote: 스파 의식이 느릿한 영화 음악처럼 안무된다.
        source: 솔스티스 저널
      - quote: 코트야드 디너는 사적인 랜턴 페스티벌처럼 빛난다.
        source: 메종 리뷰
  ramen:
    name: 긴츠 라멘
    tagline: 밤 시장의 영혼을 위한 육수 의식.
    description: 연기로 빚은 육수, 바이닐 조명, 세라믹 공예가 어우러진 라멘 공간.
    settings:
      chef-counter:
        label: 셰프 카운터
        description: 열두 좌석이 바이닐 불빛에 잠기고 셰프가 눈앞에서 매 그릇을 마무리한다.
      broth-lab:
        label: 브로스 랩
        description: 훈연 시오, 유자 쇼유, 불향 탄탄을 동시에 끓여내는 스팀 가득한 준비실.
      ceramic:
        label: 세라믹 아틀리에
        description: 매트한 그릇과 황동 국자, 갓 가마에서 나온 젓가락이 대기하는 선반.
      lounge:
        label: 미드나이트 라운지
        description: 낮은 조도와 향, 늦은 플레이리스트가 좌석 사이를 이어 주는 애프터글로우 공간.
    elements:
      umami-flight:
        label: 우마미 플라이트
        description: 훈연 시오, 유자 쇼유, 불향 탄탄 국물을 순차로 맛보는 코스.
      chashu-atelier:
        label: 차슈 아틀리에
        description: 흑설탕 타레와 산쇼 재를 더해 즉석에서 토치로 마감하는 어깨살.
      finishing-school:
        label: 피니싱 스쿨
        description: 삼나무 빛 아래서 마이크로 허브로 마지막 손질을 더하는 순간.
      mise-rituals:
        label: 미즈 리추얼
        description: 좌석마다 소스, 오일, 식물성 재료를 정물화처럼 배열한 장면.
    highlights:
      broth-ceremony:
        title: 브로스 세리머니
        body: 12시간 우린 다시마 육수를 빈초탄으로 훈연해 순서대로 서빙합니다.
      ceramic-studio:
        title: 세라믹 스튜디오
        body: 교토 가마에서 제작된 맞춤 석기, 엄지 받침으로 느긋한 시음을 돕습니다.
      vinyl-service:
        title: 바이닐 서비스
        body: 각 시팅에 맞춘 다운템포 세트가 호박빛 다이닝 룸을 감싸줍니다.
    press:
      - quote: 국물이 낮은 호박빛 속에서 바이닐 재킷처럼 빛난다.
        source: 미드나이트 푸드 랩
      - quote: 모든 카운터 좌석이 오롯이 당신을 위한 자리 같다.
        source: 녹턴 다이닝
      - quote: 연기, 시트러스, 잔열이 한 그릇에 담겼다.
        source: 스팀 아틀라스
    ctaButtons:
      ajitama-flight:
        label: 아지타마 토치
        description: 검은 설탕 타레로 마감한 반숙란을 카운터에서 즉석으로 토치합니다.
      midnight-toppings:
        label: 미드나이트 토핑
        description: 송송 썬 파, 후리카케 크럼블, 고춧실을 매 시팅마다 더합니다.
      mise-tray:
        label: 미즈 리추얼
        description: 각 게스트를 위한 소형 허브, 타레, 오일 플레이팅.
    ritualScenes:
      chef-counter:
        label: 셰프 카운터
        description: 열두 좌석뿐인 카운터에서 바이닐 조명이 반짝입니다.
      broth-lab:
        label: 브로스 랩
        description: 훈연 시오, 유자 쇼유, 불향 탄탄을 순서대로 붓는 실험실.
      ceramic-atelier:
        label: 세라믹 아틀리에
        description: 가마에서 막 꺼낸 그릇과 매트한 젓가락, 황동 레들이 기다립니다.
      lounge:
        label: 미드나이트 라운지
        description: 낮은 조도와 증기 궤적, 늦은 플레이리스트가 좌석의 여운을 이어 줍니다.
  clothing:
    name: Loom & Light Atelier
    tagline: 슬로 럭셔리를 위한 모듈형 워드로브.
    description: 서울에서 영감을 받은 테일러링 스튜디오, 프라이빗 피팅과 캡슐 스타일링을 제공합니다.
    settings:
      fittings:
        label: 프라이빗 피팅
        description: 거울이 둘러싼 살롱, 전담 테일러와 티 서비스, 즉석 수선까지 제공.
      flatlay:
        label: 캡슐 플랫레이
        description: 캡슐 구성, 원단 스와치, 룩북 동선을 펼쳐 놓는 갤러리 테이블.
      atelier:
        label: 액세서리 아틀리에
        description: 주얼리 트레이, 향 스토리, 실크 스카프가 층층이 놓인 공간.
      tailoring:
        label: 테일러 벤치
        description: 분필 패턴과 스팀 프레스, 제작 중인 의상이 가득한 작업대.
    elements:
      capsule:
        label: 캡슐 빌드
        description: 15피스 워드로브를 모듈형으로 구성하고 케어 리추얼을 더한 편집.
      casting:
        label: 캐스팅 스위트
        description: 햇살 가득한 스튜디오에서 영화 같은 드레이핑으로 룩북을 촬영.
      textile-lab:
        label: 텍스타일 랩
        description: 손짜임 린넨, 매트 스톤, 자카드가 모인 소재 라이브러리.
      mannequin:
        label: 조각된 마네킹
        description: 주얼리, 향 스토리, 레이어드 텍스처로 완성한 시그니처 스타일링.
    highlights:
      private-atelier:
        title: 프라이빗 아틀리에
        body: 워드로브 아키텍트와 1:1 피팅, 티 서비스, 라이브 테일러링.
      capsule-mapping:
        title: 캡슐 맵핑
        body: 룩북 수준의 계획 세션이 주간 로테이션 차트로 이어집니다.
      tactile-rituals:
        title: 촉각 의식
        body: 삼나무 스팀, 실크 스톤, 미니멀 향으로 섬유 케어 리추얼을 구성합니다.
    press:
      - quote: 워드로브 설계가 다도처럼 차분한 리듬으로 진행된다.
        source: 폼 & 폴드
      - quote: 모든 피팅이 사적인 오프닝 나이트처럼 느껴진다.
        source: 런웨이 노스
      - quote: 텍스처가 건축 스터디 같은 사진으로 기록된다.
        source: 스튜디오 필드
  nocturne-vale:
    name: 녹턴 베일
    tagline: 자정을 위한 촛불 테이스팅 살롱.
    description: 소믈리에 연출과 연무가 겹겹이 쌓인 서퍼 클럽, 벨벳 동선으로 마무리됩니다.
    settings:
      corner-booth:
        label: 벨벳 코너 부스
        description: 낮고 곡선형인 좌석, 촛불 타워, 흑요석 테이블, 속삭이는 플레이리스트.
      table-setting:
        label: 살롱 테이블 세팅
        description: 겹겹이 쌓인 도자기와 오닉스 스톤, 리넨 위에 부채꼴로 펼친 그래파이트 메뉴.
      wine-sculpt:
        label: 와인 서비스
        description: 보랏빛 조명과 부드러운 헤이즈 아래에서 동시다발적으로 펼쳐지는 데캔팅.
      bar-surface:
        label: 흑요석 바
        description: 쿠프 실루엣이 비치는 대리석, 인센스 트레이와 스모크 스피릿이 놓인 공간.
    elements:
      shadow-menu:
        label: 섀도 메뉴 아틀리에
        description: 텍스처드 페이퍼에 손글씨 테이스팅 메뉴를 노끈과 황동 번호로 고정.
      cutlery:
        label: 차콜 커틀러리 세트
        description: 매트 커틀러리를 흑요석 받침에 균형 있게 올려 각 코스를 준비.
      linen-lab:
        label: 리넨 랩
        description: 폭풍 회색 리넨에 톤온톤 파이핑과 자수 모노그램을 더합니다.
      candle-smoke:
        label: 캔들 스모크 리추얼
        description: 플레이트 사이사이를 잇는 속삭임 같은 연기 기둥이 공간을 향으로 채웁니다.
    highlights:
      obsidian-menu:
        title: 옵시디언 메뉴
        body: 숯빛 여섯 코스로, 불향 해산물과 차가운 연기, 셀러 페어링을 조합합니다.
      sommelier-theater:
        title: 소믈리에 시어터
        body: 동시 데캔팅과 향을 입힌 포어, 매 시 정각마다 이어지는 테이블사이드 스토리 큐.
      afterhours-gallery:
        title: 애프터 아워 갤러리
        body: 유리와 리넨, 흔들리는 빛으로 구성된 회랑을 손님이 천천히 거닙니다.
    press:
      - quote: 자정을 가로질러 벨벳 같은 적막이 이어졌다.
        source: 나이트 레저
      - quote: 코스 사이마다 손글씨 같은 촛불 연기가 그려진다.
        source: 옵시디언 테이블
      - quote: 소믈리에의 연출은 무대에 올릴 만한 수준이다.
        source: 애프터 아워 리뷰
    ritualScenes:
      wine-service:
        label: 소믈리에 리추얼
        description: 보랏빛 조명 아래 불꽃을 입힌 포어와 크리스털 서비스가 흐릅니다.
      kitchen-pass:
        label: 키친 패스
        description: 증기를 가르는 낮은 조도 속에서 플레이트가 촛불 러너에게 전달됩니다.
      bar-ritual:
        label: 바 리추얼
        description: 자수정 그라데이션이 빛나는 대리석 바와 향이 스미는 스모크.
      salon-table:
        label: 살롱 테이블
        description: 벨벳 부스, 리넨 드레이프, 그래파이트 메뉴를 따뜻한 황동으로 마무리합니다.
    ctaButtons:
      ajitama-flight:
        label: 아지타마 토치
        description: 검은 설탕 타레로 마감한 반숙란을 카운터에서 즉석으로 토치합니다.
      midnight-toppings:
        label: 미드나이트 토핑
        description: 송송 썬 파, 후리카케 크럼블, 고춧실을 매 시팅마다 준비합니다.
      mise-tray:
        label: 미즈 리추얼
        description: 각 게스트를 위한 소형 허브, 타레, 오일 플레이팅.
    ritualScenes:
      chef-counter:
        label: 셰프 카운터
        description: 열두 좌석뿐인 카운터에서 바이닐 조명이 반짝입니다.
      broth-lab:
        label: 브로스 랩
        description: 훈연 시오, 유자 쇼유, 불향 탄탄을 순서대로 붓는 실험실.
      ceramic-atelier:
        label: 세라믹 아틀리에
        description: 가마에서 막 꺼낸 그릇과 매트한 젓가락, 황동 레들.
      lounge:
        label: 미드나이트 라운지
        description: 낮은 조도와 김, 늦은 플레이리스트가 좌석의 여운을 이어 줍니다.
