# Local database names come from shared/app_constants/project.json, so two
# projects cloned from this template never share a database. Before this, every
# clone fell back to the template's own dev/test databases and quietly wrote
# into the same Postgres databases as its siblings.
#
# The base is `databaseName` when that key is present, and the slug otherwise.
# They are separate because a repository and the product inside it can be called
# different things: this repository is shengfukung-wenfu and the product is
# TempleMate, so the local databases are templemate_dev and templemate_test. A
# clone that has not set `databaseName` keeps deriving from its slug exactly as
# before, so adding the key changed nothing for anyone else.
#
# Override per deployment with PGDATABASE / PGDATABASE_TEST / PGUSER. PROJECT_SLUG
# still changes the slug without editing project.json, but only affects database
# names where no `databaseName` is set -- the more specific key wins.
#
# Production and staging below read PGDATABASE alone and never touch this base,
# so nothing derived here can reach a deployment. That is asserted in
# test/lib/database_configuration_test.rb rather than left as a comment.
<%
  require "json"

  project =
    begin
      JSON.parse(File.read(Rails.root.join("..", "shared", "app_constants", "project.json")))
    rescue StandardError
      {}
    end

  normalize = ->(value) { value.to_s.downcase.gsub(/[^a-z0-9]+/, "_").gsub(/\A_+|_+\z/, "") }

  project_slug = ENV["PROJECT_SLUG"]
  project_slug = project["slug"] if project_slug.nil? || project_slug.strip.empty?

  # The product's name when it has one, the repository's slug when it does not.
  # Absent the key, this is byte-for-byte the old behaviour.
  db_base = normalize.call(project["databaseName"])
  db_base = normalize.call(project_slug) if db_base.empty?
  db_base = "app" if db_base.empty?
%>

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  # No derived default, and blank when PGUSER is unset -- exactly like password
  # below. A database NAME can be invented; a Postgres ROLE cannot, it has to
  # already exist. Defaulting this to "#{db_base}_dev" made every fresh clone
  # fail with `role "..._dev" does not exist` before it could create anything.
  # Blank, libpq falls back to the OS user, which is what owns a local
  # development database in practice. Deployments set PGUSER explicitly
  # (production uses templemate_admin).
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "#{db_base}_dev") %>

test:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE_TEST", "#{db_base}_test") %>

# DATABASE_URL is not set on the droplet, so `url:` resolved to nil here and the
# database name was decided entirely by libpq reading PGDATABASE. That made the
# name unknowable from config without opening a connection, and it is why
# staging silently ran against production's database whenever its systemd
# ExecStart override was missing. Naming it here is what lets the boot guard in
# config/initializers/deployment_identity.rb check the name before connecting.
#
# The default of nil is required, not sloppy. Rails renders the ERB for this
# whole file in one pass, in whatever environment happens to be running, so a
# bare ENV.fetch("PGDATABASE") on these two lines raises KeyError during
# `bin/rails test` and every development boot, where PGDATABASE is legitimately
# unset. Observed: it aborts the test suite from line 66, production's line.
#
# Absence is still fatal where it matters, just enforced one layer up:
# DeploymentIdentity refuses to boot production or staging when the resolved
# name is blank, and unlike a KeyError from inside an ERB template it can say
# which file to look in. A forgotten value is absent, and absent cannot serve
# traffic -- that property is kept, the mechanism moved.
production:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", nil) %>

staging:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", nil) %>
