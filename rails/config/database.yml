# Database names derive from the project slug in shared/app_constants/project.json
# so two projects cloned from this template never share a database. Before this,
# every clone fell back to the template's own dev/test databases and quietly
# wrote into the same Postgres databases as its siblings.
#
# Override per deployment with PGDATABASE / PGDATABASE_TEST / PGUSER, or set
# PROJECT_SLUG to change the derived base without editing project.json.
#
# These fallbacks are what this project actually uses: the local databases are
# named shengfukung_wenfu_dev and shengfukung_wenfu_test to match, so a clone
# works with no .env entries at all. Nothing here should need a local override.
<%
  require "json"

  project_slug = ENV["PROJECT_SLUG"]
  if project_slug.nil? || project_slug.strip.empty?
    project_slug =
      begin
        JSON.parse(File.read(Rails.root.join("..", "shared", "app_constants", "project.json")))["slug"]
      rescue StandardError
        nil
      end
  end

  db_base = project_slug.to_s.downcase.gsub(/[^a-z0-9]+/, "_").gsub(/\A_+|_+\z/, "")
  db_base = "app" if db_base.empty?
%>

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  # No derived default, and blank when PGUSER is unset -- exactly like password
  # below. A database NAME can be invented; a Postgres ROLE cannot, it has to
  # already exist. Defaulting this to "#{db_base}_dev" made every fresh clone
  # fail with `role "..._dev" does not exist` before it could create anything.
  # Blank, libpq falls back to the OS user, which is what owns a local
  # development database in practice. Deployments set PGUSER explicitly
  # (production uses templemate_admin).
  username: <%= ENV["PGUSER"] %>
  password: <%= ENV["PGPASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE", "#{db_base}_dev") %>

test:
  <<: *default
  database: <%= ENV.fetch("PGDATABASE_TEST", "#{db_base}_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

staging:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
